# Intelli-Credit theme.
#
# Theme only. Server and browser options are deliberately NOT set here: hosting
# platforms manage those themselves, and overriding them from the repo is a
# common cause of a deploy that builds but will not start.

[theme]
base = "light"

# Deep institutional blue — the register of a credit memo, not a consumer app.
primaryColor = "#1B4F8C"

backgroundColor = "#F6F8FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#111C2E"
