<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1030" width="1400" height="1030" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="mast" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E2A4D"/>
      <stop offset="58%" stop-color="#1B4F8C"/>
      <stop offset="100%" stop-color="#2E6BB0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8496AE"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B4F8C"/>
    </marker>
    <style>
      .band-label { font-size: 12px; font-weight: 700; letter-spacing: 1.6px; fill: #8496AE; }
      .card-title { font-size: 15px; font-weight: 650; fill: #111C2E; }
      .card-desc  { font-size: 12px; fill: #566B88; }
      .card-mod   { font-size: 10.5px; font-weight: 600; fill: #8496AE; font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }
      .on-dark    { fill: #ffffff; }
      .on-dark-sm { fill: #C9DCF2; font-size: 12.5px; }
      .note       { font-size: 12px; fill: #566B88; font-style: italic; }
    </style>
  </defs>

  <rect width="1400" height="1030" fill="#F6F8FC"/>

  <!-- ===== Masthead ===== -->
  <rect x="40" y="28" width="1320" height="74" rx="14" fill="url(#mast)"/>
  <text x="66" y="62" class="on-dark" font-size="22" font-weight="700">Intelli-Credit — System Architecture</text>
  <text x="66" y="84" class="on-dark-sm">Every signal enters one ledger, so the memo, the audit trail and the explanation all fall out of a single structure</text>

  <!-- ===== BAND 1: SOURCES ===== -->
  <text x="40" y="140" class="band-label">1 · WHAT GOES IN</text>

  <g>
    <rect x="40" y="152" width="308" height="96" rx="12" fill="#fff" stroke="#DCE5F2"/>
    <rect x="40" y="152" width="4" height="96" rx="2" fill="#1B4F8C"/>
    <text x="62" y="180" class="card-title">Structured financials</text>
    <text x="62" y="201" class="card-desc">Bank statement, GST summary, ITR,</text>
    <text x="62" y="217" class="card-desc">shareholding pattern (CSV / XLSX)</text>
    <text x="62" y="238" class="card-mod">data_loader.py</text>
  </g>
  <g>
    <rect x="378" y="152" width="308" height="96" rx="12" fill="#fff" stroke="#DCE5F2"/>
    <rect x="378" y="152" width="4" height="96" rx="2" fill="#1B4F8C"/>
    <text x="400" y="180" class="card-title">Documents</text>
    <text x="400" y="201" class="card-desc">Annual report, legal notice, sanction</text>
    <text x="400" y="217" class="card-desc">letter, rating report, board minutes</text>
    <text x="400" y="238" class="card-mod">ingestion.py</text>
  </g>
  <g>
    <rect x="716" y="152" width="308" height="96" rx="12" fill="#fff" stroke="#DCE5F2"/>
    <rect x="716" y="152" width="4" height="96" rx="2" fill="#1B4F8C"/>
    <text x="738" y="180" class="card-title">Analyst judgement</text>
    <text x="738" y="201" class="card-desc">Site visit notes, management quality,</text>
    <text x="738" y="217" class="card-desc">collateral condition — typed in prose</text>
    <text x="738" y="238" class="card-mod">qualitative.py</text>
  </g>
  <g>
    <rect x="1054" y="152" width="306" height="96" rx="12" fill="#fff" stroke="#DCE5F2"/>
    <rect x="1054" y="152" width="4" height="96" rx="2" fill="#0F766E"/>
    <text x="1076" y="180" class="card-title">The open web</text>
    <text x="1076" y="201" class="card-desc">News, NCLT/insolvency filings,</text>
    <text x="1076" y="217" class="card-desc">RBI &amp; SEBI action — not in the files</text>
    <text x="1076" y="238" class="card-mod">live_research.py</text>
  </g>

  <path d="M194,252 L194,288" stroke="#8496AE" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M532,252 L532,288" stroke="#8496AE" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M870,252 L870,288" stroke="#8496AE" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M1207,252 L1207,288" stroke="#8496AE" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== BAND 2: MAKE SENSE OF IT ===== -->
  <text x="40" y="318" class="band-label">2 · TURN IT INTO SIGNALS</text>

  <g>
    <rect x="40" y="330" width="308" height="112" rx="12" fill="#fff" stroke="#DCE5F2"/>
    <text x="62" y="358" class="card-title">Cross-verify</text>
    <text x="62" y="379" class="card-desc">Declared GST turnover vs money that</text>
    <text x="62" y="395" class="card-desc">actually reached the bank. Detects</text>
    <text x="62" y="411" class="card-desc">circular trading and inflated revenue.</text>
    <text x="62" y="432" class="card-mod">reconciliation.py</text>
  </g>
  <g>
    <rect x="378" y="330" width="308" height="112" rx="12" fill="#fff" stroke="#DCE5F2"/>
    <text x="400" y="358" class="card-title">Extract + retrieve</text>
    <text x="400" y="379" class="card-desc">Figures with evidence (gaps declared,</text>
    <text x="400" y="395" class="card-desc">never invented). TF-IDF search across</text>
    <text x="400" y="411" class="card-desc">six risk themes inside the documents.</text>
    <text x="400" y="432" class="card-mod">document_intel.py · rag_engine.py</text>
  </g>
  <g>
    <rect x="716" y="330" width="308" height="112" rx="12" fill="#fff" stroke="#DCE5F2"/>
    <text x="738" y="358" class="card-title">Read the notes</text>
    <text x="738" y="379" class="card-desc">Ten rules map an officer's own words</text>
    <text x="738" y="395" class="card-desc">("factory at 40% capacity") onto the</text>
    <text x="738" y="411" class="card-desc">Five Cs, keeping human judgement in.</text>
    <text x="738" y="432" class="card-mod">qualitative.py</text>
  </g>
  <g>
    <rect x="1054" y="330" width="306" height="112" rx="12" fill="#fff" stroke="#DCE5F2"/>
    <text x="1076" y="358" class="card-title">Search outside</text>
    <text x="1076" y="379" class="card-desc">Five query templates. Headlines are</text>
    <text x="1076" y="395" class="card-desc">keyword-scanned for distress, promoter,</text>
    <text x="1076" y="411" class="card-desc">litigation and regulatory language.</text>
    <text x="1076" y="432" class="card-mod">live_research.py</text>
  </g>

  <path d="M194,446 L194,486" stroke="#1B4F8C" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M532,446 L532,486" stroke="#1B4F8C" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M870,446 L870,486" stroke="#1B4F8C" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M1207,446 L1207,486" stroke="#1B4F8C" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ===== BAND 3: THE LEDGER ===== -->
  <text x="40" y="516" class="band-label">3 · ONE LEDGER — THE IDEA THE WHOLE SYSTEM RESTS ON</text>

  <rect x="40" y="528" width="1320" height="118" rx="14" fill="#0E2A4D"/>
  <text x="66" y="562" class="on-dark" font-size="17" font-weight="700">The Adjustment Ledger</text>
  <text x="66" y="586" class="on-dark-sm">However a signal arose — a spreadsheet, a paragraph on page 147, a typed note, a headline — it is written down the same way:</text>

  <g font-size="12.5">
    <rect x="66" y="600" width="252" height="30" rx="7" fill="#1B4F8C"/>
    <text x="80" y="620" fill="#fff">which of the Five Cs it affects</text>
    <rect x="330" y="600" width="200" height="30" rx="7" fill="#1B4F8C"/>
    <text x="344" y="620" fill="#fff">how many points</text>
    <rect x="542" y="600" width="252" height="30" rx="7" fill="#1B4F8C"/>
    <text x="556" y="620" fill="#fff">why, in plain language</text>
    <rect x="806" y="600" width="290" height="30" rx="7" fill="#1B4F8C"/>
    <text x="820" y="620" fill="#fff">the evidence that proves it</text>
  </g>
  <text x="1116" y="620" font-size="12" fill="#9FC0E4" font-style="italic">nothing moves the</text>
  <text x="1116" y="636" font-size="12" fill="#9FC0E4" font-style="italic">score silently</text>

  <path d="M420,650 L420,690" stroke="#1B4F8C" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M980,650 L980,690" stroke="#1B4F8C" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ===== BAND 4: TWO OPINIONS ===== -->
  <text x="40" y="720" class="band-label">4 · TWO INDEPENDENT OPINIONS</text>

  <g>
    <rect x="40" y="732" width="646" height="118" rx="12" fill="#fff" stroke="#DCE5F2"/>
    <rect x="40" y="732" width="4" height="118" rx="2" fill="#0F766E"/>
    <text x="62" y="760" class="card-title">The rulebook — Five Cs scorecard</text>
    <text x="62" y="782" class="card-desc">Character · Capacity · Capital · Collateral · Conditions. Each starts at 20 points;</text>
    <text x="62" y="798" class="card-desc">the ledger adds and subtracts. 75+ is low risk, 50–74 moderate, below 50 high.</text>
    <text x="62" y="814" class="card-desc">Entirely deterministic — the same inputs always give the same score.</text>
    <text x="62" y="838" class="card-mod">scoring.py · recommendation.py</text>
  </g>
  <g>
    <rect x="714" y="732" width="646" height="118" rx="12" fill="#fff" stroke="#DCE5F2"/>
    <rect x="714" y="732" width="4" height="118" rx="2" fill="#B45309"/>
    <text x="736" y="760" class="card-title">The second opinion — RandomForest</text>
    <text x="736" y="782" class="card-desc">23 engineered features, 260 trees, 0.876 cross-validated accuracy. Trained on</text>
    <text x="736" y="798" class="card-desc">synthetic borrowers, not a real loan book — so it is a consistency check, not proof.</text>
    <text x="736" y="814" class="card-desc">Explains each call per borrower, not with one global chart.</text>
    <text x="736" y="838" class="card-mod">ml_hybrid.py</text>
  </g>

  <path d="M363,854 L363,884 L700,884 L700,908" fill="none" stroke="#8496AE" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M1037,854 L1037,884 L700,884" fill="none" stroke="#8496AE" stroke-width="1.5"/>

  <!-- ===== BAND 5: FUSION + OUTPUT ===== -->
  <g>
    <rect x="40" y="910" width="646" height="86" rx="12" fill="#fff" stroke="#C2D3E8" stroke-width="1.5"/>
    <text x="62" y="938" class="card-title">Fusion — and the rule that governs it</text>
    <text x="62" y="960" class="card-desc">If they agree, done. If they disagree, the <tspan font-weight="700" fill="#111C2E">machine cannot overrule the</tspan></text>
    <text x="62" y="976" class="card-desc"><tspan font-weight="700" fill="#111C2E">rulebook below 90% confidence</tspan> — and the safer option wins.</text>
  </g>
  <g>
    <rect x="714" y="910" width="646" height="86" rx="12" fill="#E8F5F2" stroke="#0F766E"/>
    <text x="736" y="938" class="card-title">Out comes the Credit Appraisal Memo</text>
    <text x="736" y="960" class="card-desc">29 sections. Decision, loan limit, interest band — and for every point awarded</text>
    <text x="736" y="976" class="card-desc">or deducted, the reason and its evidence. Exports to TXT, DOCX or PDF.</text>
  </g>

  <path d="M690,953 L706,953" stroke="#8496AE" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
